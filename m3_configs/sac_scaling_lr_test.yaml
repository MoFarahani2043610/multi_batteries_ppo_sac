# m3_configs/sac_scaling_n20_stability_test.yaml
# ============================
# TEST CONFIG — combined critic-stability fixes for N=20, based on
# external advice: reduce tau (slower target updates), increase batch_size
# (lower critic-update variance), delay learning_starts (more diverse
# replay buffer before training begins). ent_coef stays 'auto' since a
# fixed value was already ruled out as a fix.

algo: sac

env:
  n_batteries: 20
  dt_hours: 0.08333
  degradation_penalty: 0.0
  normalize_obs: true
  price_ref: 52.0
  price_source: caiso
  caiso_path: cache/caiso_2024_2026_5min.parquet

training:
  total_timesteps: 1000000
  n_seeds: 1          # testing seed 0 first
  eval_freq: 10000
  eval_episodes: 10
  log_interval: 5

sac:
  learning_rate: 0.001        # back to original value — low LR alone didn't fix it
  buffer_size: 500000
  learning_starts: 5000       # TEST: delayed from 1000 -> 5000
  batch_size: 512              # TEST: increased from 256 -> 512
  tau: 0.001                   # TEST: reduced from 0.005 -> 0.001 (slower target updates)
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto
  policy: MlpPolicy
  policy_kwargs:
    net_arch: [400, 300]

logging:
  log_dir: m3_logs/sac_n20_stability_test
  tensorboard: true
  save_freq: 100000
  verbose: 1