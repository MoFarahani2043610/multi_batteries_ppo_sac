# m3_configs/sac_n1_shallow_test.yaml
# ============================
# TEST CONFIG — shallower network architecture for N=1, per Danial's
# suggestion, to check whether it improves the plateau/oscillation
# behavior observed with the [400,300] network.

algo: sac

env:
  n_batteries: 1
  dt_hours: 0.08333
  degradation_penalty: 0.0
  normalize_obs: true
  price_ref: 52.0
  price_source: caiso
  caiso_path: cache/caiso_2024_2026_5min.parquet

training:
  total_timesteps: 1000000
  n_seeds: 1          # testing seed 0 first, for direct comparison
  eval_freq: 10000
  eval_episodes: 10
  log_interval: 5

sac:
  learning_rate: 0.001
  buffer_size: 500000
  learning_starts: 1000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto
  policy: MlpPolicy
  policy_kwargs:
    net_arch: [128, 128]   # TEST: reduced from [400, 300]

logging:
  log_dir: m3_logs/sac_n1_shallow_test
  tensorboard: true
  save_freq: 100000
  verbose: 1