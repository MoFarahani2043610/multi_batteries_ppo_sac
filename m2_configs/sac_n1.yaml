algo: sac

env:
  n_batteries: 1
  dt_hours: 0.08333
  degradation_penalty: 0.0
  normalize_obs: true
  price_ref: 52.0          # real CAISO mean price $/MWh
  price_source: caiso      # use real CAISO data via loader.py
  caiso_path: cache/caiso_2024_2026_5min.parquet

training:
  total_timesteps: 1000000
  n_seeds: 5
  eval_freq: 5000
  eval_episodes: 10
  log_interval: 1

sac:
  learning_rate: 0.001
  buffer_size: 500000
  learning_starts: 1000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto
  policy: MlpPolicy
  policy_kwargs:
    net_arch: [400, 300]

logging:
  log_dir: m2_logs/sac_n1
  tensorboard: true
  save_freq: 50000
  verbose: 1