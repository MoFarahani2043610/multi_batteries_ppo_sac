algo: ppo

env:
  n_batteries: 1
  dt_hours: 0.08333
  degradation_penalty: 0.0
  normalize_obs: true
  price_ref: 30.0

training:
  total_timesteps: 500000
  n_seeds: 1
  eval_freq: 5000
  eval_episodes: 10
  log_interval: 1

ppo:
  learning_rate: 0.001
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy: MlpPolicy
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]

logging:
  log_dir: m2_logs/ppo_n1
  tensorboard: true
  save_freq: 50000
  verbose: 1